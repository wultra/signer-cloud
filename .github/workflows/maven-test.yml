name: Test with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'releases/**'
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - 'releases/**'

jobs:
  maven-tests:
    uses: wultra/wultra-infrastructure/.github/workflows/maven-test.yml@develop
    secrets: inherit
    with:
      java_version: 21

  upload-artifacts:
    needs: maven-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload test resources
        uses: actions/upload-artifact@v4
        with:
          name: test-resources
          path: signer-cloud-server/target/test-resources