signer-cloud.server.ejbca.rest-client-configuration.certificate-auth-enabled=false

spring.datasource.url=jdbc:h2:mem:signer_cloud_server;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.change-log=file:../docs/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

spring.test.database.replace=none

signer-cloud.server.security.auth.type=BASIC_HTTP
spring.security.user.name=user
spring.security.user.password=password

signer-cloud.server.document.cleanup.cron=-

signer-cloud.server.signer.expiration.job.cron=-

