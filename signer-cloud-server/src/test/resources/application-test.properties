# Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/ORCLPDB1
spring.datasource.username=signer_cloud_server
spring.datasource.password=signer_cloud_server

spring.liquibase.change-log=file:../docs/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false

spring.test.database.replace=none

signer-cloud.server.security.auth.type=BASIC_HTTP
spring.security.user.name=user
spring.security.user.password=password

signer-cloud.server.document.cleanup.cron=-

signer-cloud.server.signer.expiration.job.cron=-

signer-cloud.server.signer.renewal.job.cron=-

signer-cloud.server.callback.dispatch-pending-callback-events.job.cron=-
signer-cloud.server.callback.cleanup-callback-events.job.cron=-
signer-cloud.server.callback.rerun-stale-callback-events.job.cron=-
signer-cloud.server.callback.expired.url=https://example.com/callback/expired
signer-cloud.server.callback.expired.enabled=true
signer-cloud.server.callback.renewed.url=https://example.com/callback/renewed
signer-cloud.server.callback.renewed.enabled=true

logging.level.com.wultra=DEBUG
logging.level.io.getlime=DEBUG
#logging.level.org.springframework.jdbc.core=DEBUG
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
