spring.datasource.url=${SIGNER_CLOUD_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signer_cloud_server}
spring.datasource.username=${SIGNER_CLOUD_DATASOURCE_USERNAME:}
spring.datasource.password=${SIGNER_CLOUD_DATASOURCE_PASSWORD:}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=HikariPool-Signer-Cloud-Server

spring.sql.init.mode=never
spring.data.jdbc.repositories.enabled=true

spring.application.name=signer-cloud-server

banner.application.name=${spring.application.name}
banner.application.version=@project.version@

signer-cloud.server.powerauth.url=${SIGNER_CLOUD_POWERAUTH_URL:http://localhost:8080/powerauth-java-server/rest}
signer-cloud.server.powerauth.rest-client-configuration.power-auth-client-token=${SIGNER_CLOUD_POWERAUTH_CLIENT_TOKEN:}
signer-cloud.server.powerauth.rest-client-configuration.power-auth-client-secret=${SIGNER_CLOUD_POWERAUTH_CLIENT_SECRET:}

signer-cloud.server.ejbca.certificate-profile-name=${SIGNER_CLOUD_EJBCA_CERTIFICATE_PROFILE_NAME:UserCertificateProfile}
signer-cloud.server.ejbca.end-entity-profile-name=${SIGNER_CLOUD_EJBCA_END_ENTITY_PROFILE_NAME:UserEndEntityProfile}
signer-cloud.server.ejbca.certificate-authority-name=${SIGNER_CLOUD_EJBCA_CERTIFICATE_AUTHORITY_NAME:IssuingCA}
signer-cloud.server.ejbca.rest-client-configuration.base-url=${SIGNER_CLOUD_EJBCA_URL:}
signer-cloud.server.ejbca.rest-client-configuration.certificate-auth-enabled=true
signer-cloud.server.ejbca.rest-client-configuration.use-custom-keystore=true
signer-cloud.server.ejbca.rest-client-configuration.key-store-password=${SIGNER_CLOUD_EJBCA_KEYSTORE_PASSWORD:}
signer-cloud.server.ejbca.rest-client-configuration.key-alias=${SIGNER_CLOUD_EJBCA_KEY_ALIAS:}
signer-cloud.server.ejbca.rest-client-configuration.key-password=${SIGNER_CLOUD_EJBCA_KEY_PASSWORD:}
signer-cloud.server.ejbca.rest-client-configuration.key-store-bytes=${SIGNER_CLOUD_EJBCA_KEYSTORE_BASE64:}

signer-cloud.server.pades.tsa-url=${SIGNER_CLOUD_PADES_TSA_URL:}
signer-cloud.server.pades.signature-level=${SIGNER_CLOUD_PADES_SIGNATURE_LEVEL:PAdES_BASELINE_B}

signer-cloud.server.security.auth.type=OAUTH2

# OAuth 2.0
spring.security.oauth2.resource-server.jwt.issuer-uri=${SIGNER_CLOUD_OAUTH2_ISSUER_URI:}
spring.security.oauth2.resource-server.jwt.audiences=${SIGNER_CLOUD_OAUTH2_AUDIENCES:}

signer-cloud.server.document.cleanup.cron=${SIGNER_CLOUD_DOCUMENT_CLEANUP_CRON:2 1 0 * * *}
signer-cloud.server.document.waiting.retention-period=${SIGNER_CLOUD_DOCUMENT_WAITING_RETENTION_PERIOD:}
signer-cloud.server.document.waiting.timeout=${SIGNER_CLOUD_DOCUMENT_WAITING_TIMEOUT:3600s}
signer-cloud.server.document.rejected.retention-period=${SIGNER_CLOUD_DOCUMENT_REJECTED_RETENTION_PERIOD:}
signer-cloud.server.document.signed.retention-period=${SIGNER_CLOUD_DOCUMENT_SIGNED_RETENTION_PERIOD:}

signer-cloud.server.document.hash-algorithm=${SIGNER_CLOUD_DOCUMENT_HASH_ALGORITHM:SHA256}

signer-cloud.server.signer.expiration.job.cron=${SIGNER_CLOUD_SIGNER_EXPIRATION_JOB_CRON:3 2 0 * * *}
signer-cloud.server.signer.expiration.job.limit=${SIGNER_CLOUD_SIGNER_EXPIRATION_JOB_LIMIT:1000}
signer-cloud.server.signer.renewal.job.cron=${SIGNER_CLOUD_SIGNER_RENEWAL_JOB_CRON:0 */15 * * * *}
signer-cloud.server.signer.renewal.job.limit=${SIGNER_CLOUD_SIGNER_RENEWAL_JOB_LIMIT:25}
signer-cloud.server.signer.renewal.threshold=${SIGNER_CLOUD_SIGNER_RENEWAL_THRESHOLD:14d}

signer-cloud.server.callback.expired.url=${SIGNER_CLOUD_CALLBACK_EXPIRED_URL:}
signer-cloud.server.callback.expired.enabled=${SIGNER_CLOUD_CALLBACK_EXPIRED_ENABLED:false}
signer-cloud.server.callback.expired.initial-backoff=2s
signer-cloud.server.callback.expired.max-attempts=${SIGNER_CLOUD_CALLBACK_EXPIRED_MAX_ATTEMPTS:1}
signer-cloud.server.callback.expired.retention-period=${SIGNER_CLOUD_CALLBACK_EXPIRED_RETENTION_PERIOD:30d}
signer-cloud.server.callback.renewed.url=${SIGNER_CLOUD_CALLBACK_RENEWED_URL:}
signer-cloud.server.callback.renewed.enabled=${SIGNER_CLOUD_CALLBACK_RENEWED_ENABLED:false}
signer-cloud.server.callback.renewed.initial-backoff=2s
signer-cloud.server.callback.renewed.max-attempts=${SIGNER_CLOUD_CALLBACK_RENEWED_MAX_ATTEMPTS:1}
signer-cloud.server.callback.renewed.retention-period=${SIGNER_CLOUD_CALLBACK_RENEWED_RETENTION_PERIOD:30d}
signer-cloud.server.callback.dispatch-pending-callback-events.job.cron=${SIGNER_CLOUD_CALLBACK_DISPATCH_PENDING_CALLBACK_EVENTS_JOB_CRON:0 */1 * * * *}
signer-cloud.server.callback.dispatch-pending-callback-events.job.limit=${SIGNER_CLOUD_CALLBACK_DISPATCH_PENDING_CALLBACK_EVENTS_JOB_LIMIT:100}
signer-cloud.server.callback.cleanup-callback-events.job.cron=${SIGNER_CLOUD_CALLBACK_CLEANUP_CALLBACK_EVENTS_JOB_CRON:0 */5 * * * *}
signer-cloud.server.callback.rerun-stale-callback-events.job.cron=${SIGNER_CLOUD_CALLBACK_RERUN_STALE_CALLBACK_EVENTS_JOB_CRON:0 */5 * * * *}
signer-cloud.server.callback.max-backoff=32s
signer-cloud.server.callback.backoff-multiplier=1.5
signer-cloud.server.callback.force-rerun-period=${SIGNER_CLOUD_CALLBACK_FORCE_RERUN_PERIOD:}
signer-cloud.server.callback.failure-threshold=${SIGNER_CLOUD_CALLBACK_FAILURE_THRESHOLD:200}
signer-cloud.server.callback.failure-reset-timeout=${SIGNER_CLOUD_CALLBACK_FAILURE_RESET_TIMEOUT:60s}
signer-cloud.server.callback.http-proxy-enabled=${SIGNER_CLOUD_CALLBACK_HTTP_PROXY_ENABLED:false}
signer-cloud.server.callback.http-proxy-host=${SIGNER_CLOUD_CALLBACK_HTTP_PROXY_HOST:127.0.0.1}
signer-cloud.server.callback.http-proxy-port=${SIGNER_CLOUD_CALLBACK_HTTP_PROXY_PORT:8080}
signer-cloud.server.callback.http-proxy-username=${SIGNER_CLOUD_CALLBACK_HTTP_PROXY_USERNAME:}
signer-cloud.server.callback.http-proxy-password=${SIGNER_CLOUD_CALLBACK_HTTP_PROXY_PASSWORD:}
signer-cloud.server.callback.http-connection-timeout=${SIGNER_CLOUD_CALLBACK_HTTP_CONNECTION_TIMEOUT:5s}
signer-cloud.server.callback.http-response-timeout=${SIGNER_CLOUD_CALLBACK_HTTP_RESPONSE_TIMEOUT:60s}
signer-cloud.server.callback.http-max-idle-time=${SIGNER_CLOUD_CALLBACK_HTTP_MAX_IDLE_TIME:200s}
signer-cloud.server.callback.thread-pool-core-size=${SIGNER_CLOUD_CALLBACK_THREAD_POOL_CORE_SIZE:1}
signer-cloud.server.callback.thread-pool-max-size=${SIGNER_CLOUD_CALLBACK_THREAD_POOL_MAX_SIZE:2}
signer-cloud.server.callback.thread-pool-queue-capacity=${SIGNER_CLOUD_CALLBACK_THREAD_POOL_QUEUE_CAPACITY:1000}

management.endpoints.web.exposure.include=health,info
management.info.git.mode=simple

management.tracing.sampling.probability=1.0

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

server.forward-headers-strategy=framework