spring.datasource.url=jdbc:postgresql://localhost:5432/signer_cloud_server
spring.datasource.username=signer_cloud_server

server.port=8090

signer-cloud.server.ejbca.certificate-profile-name=UserCertificateProfile
signer-cloud.server.ejbca.end-entity-profile-name=UserEndEntityProfile
signer-cloud.server.ejbca.certificate-authority-name=IssuingCA
signer-cloud.server.ejbca.rest-client-configuration.base-url=https://smoke-ejbca-dev.wultra.app/ejbca/ejbca-rest-api
signer-cloud.server.ejbca.rest-client-configuration.certificate-auth-enabled=false
signer-cloud.server.ejbca.rest-client-configuration.use-custom-keystore=true
signer-cloud.server.ejbca.rest-client-configuration.key-store-password=
signer-cloud.server.ejbca.rest-client-configuration.key-alias=
signer-cloud.server.ejbca.rest-client-configuration.key-password=
signer-cloud.server.ejbca.rest-client-configuration.key-store-bytes=

signer-cloud.server.pades.tsa-url=https://freetsa.org/tsr

signer-cloud.server.callback.expired.url=https://example.com/callback/expired
signer-cloud.server.callback.renewed.url=https://example.com/callback/renewed

signer-cloud.server.security.auth.type=BASIC_HTTP
spring.security.user.name=user
#password is generated to the log during startup

signer-cloud.server.document.cleanup.cron=0 0/1 * * * *

signer-cloud.server.signer.expiration.job.cron=0 0/1 * * * *

logging.level.com.wultra=DEBUG
logging.level.io.getlime=DEBUG
#logging.level.org.springframework.jdbc.core=DEBUG

management.endpoints.web.exposure.include=*
